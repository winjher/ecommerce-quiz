<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CS 4 Exam</title>
<style>
  :root {
    --brand: #1e3a8a;
    --accent: #f97316;
    --bg: #f3f4f6;
    --card: #ffffff;
    --text: #1f2937;
    --muted: #6b7280;
    --good: #15803d;
    --bad: #b91c1c;
  }
  * { box-sizing: border-box; }
  body { font-family: system-ui, -apple-system, "Segoe UI", Arial, sans-serif; background: var(--bg); margin: 0; color: var(--text); }

  /* Top navigation bar */
  .topbar { background: var(--brand); color: #fff; padding: 14px 20px; display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  .brand { font-weight: 800; font-size: 18px; letter-spacing: .3px; }
  .brand span { color: var(--accent); }
  .topbar .tag { background: rgba(255,255,255,.15); padding: 6px 12px; border-radius: 999px; font-size: 13px; }

  /* Course banner */
  .banner { background: linear-gradient(135deg, #1e3a8a 0%, #2563eb 60%, #f97316 140%); color: #fff; padding: 26px 20px; }
  .banner-inner { max-width: 900px; margin: 0 auto; }
  .banner .course { font-size: 13px; text-transform: uppercase; letter-spacing: 1.2px; opacity: .9; margin: 0 0 6px; }
  .banner h2 { margin: 0 0 12px; font-size: 24px; line-height: 1.25; }
  .meta-row { display: flex; flex-wrap: wrap; gap: 10px; }
  .meta-chip { background: rgba(255,255,255,.18); border-radius: 8px; padding: 8px 12px; font-size: 14px; }
  .meta-chip b { display: block; font-size: 11px; text-transform: uppercase; letter-spacing: .8px; opacity: .85; font-weight: 600; }

  /* Main content */
  .wrap { max-width: 900px; margin: 0 auto; padding: 16px; }
  .card { background: var(--card); border-radius: 12px; padding: 20px; box-shadow: 0 2px 10px rgba(0,0,0,.06); margin-bottom: 16px; }
  h1 { font-size: 20px; margin: 0 0 8px; }
  p { line-height: 1.5; }

  input[type=text] { width: 100%; padding: 12px; font-size: 16px; border: 1px solid #cbd5e1; border-radius: 8px; background: #fff; }
  input[type=text]:focus { outline: 2px solid var(--brand); border-color: transparent; }

  button { background: var(--accent); color: #fff; border: 0; border-radius: 8px; padding: 12px 22px; font-size: 16px; font-weight: 600; cursor: pointer; }
  button:hover { filter: brightness(.95); }
  button:disabled { background: #9ca3af; cursor: default; }

  /* Sticky timer */
  #timer { position: sticky; top: 0; z-index: 5; background: #111827; color: #fff; padding: 12px; border-radius: 10px; text-align: center; font-size: 18px; font-weight: 700; margin-bottom: 14px; box-shadow: 0 2px 8px rgba(0,0,0,.2); }

  /* Question items */
  .q { background: var(--card); border: 1px solid #e5e7eb; border-radius: 12px; padding: 16px; margin-bottom: 12px; }
  .q-head { display: flex; gap: 12px; align-items: flex-start; margin-bottom: 10px; }
  .num { flex: 0 0 auto; width: 30px; height: 30px; border-radius: 50%; background: var(--brand); color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 14px; }
  .q label { font-weight: 600; line-height: 1.4; }

  .msg { color: var(--bad); margin-top: 10px; }
  .ok { color: var(--good); margin-top: 10px; }
  .center { text-align: center; }

  /* Result screen */
  .score { font-size: 44px; font-weight: 800; text-align: center; color: var(--brand); margin: 18px 0 6px; }
  .qa { border-top: 1px solid #e5e7eb; padding: 12px 0; }
  .qa .good { color: var(--good); font-weight: 700; }
  .qa .bad { color: var(--bad); font-weight: 700; }

  footer { text-align: center; color: var(--muted); font-size: 13px; padding: 20px 16px 30px; }

  @media (max-width: 480px) {
    .banner h2 { font-size: 20px; }
    .score { font-size: 36px; }
  }
</style>
</head>
<body>

<div class="topbar">
  <div class="brand">CS <span>4</span> Exam Portal</div>
  <div class="tag">Elective 3 &middot; E-Commerce</div>
</div>

<div class="banner">
  <div class="banner-inner">
    <p class="course">Elective 3 &middot; E-Commerce</p>
    <h2>CS 4 Exam: Security Governance &amp; Legal Issues</h2>
    <div class="meta-row">
      <div class="meta-chip"><b>Professor</b>Dr. Jerwin Montellano</div>
      <div class="meta-chip"><b>Subject</b>Elective 3: E-Commerce</div>
      <div class="meta-chip"><b>Duration</b>60 minutes</div>
    </div>
  </div>
</div>

<div class="wrap">
  <div class="card" id="app"></div>
</div>

<footer>Dr. Jerwin Montellano &middot; Elective 3: E-Commerce</footer>

<script>
// The server fills in the URL of the deployment this page was opened from.
const API_URL = 'https://script.google.com/macros/s/AKfycbzOwOrO2rBkM4XFjyvuyQbCshQCM2mqo_GxHUXV9Rgh0BeA0VPk9O-NCRA6UOPbSh96/exec';

const EXAM_TITLE = 'CS 4 Exam: Security Governance & Legal Issues';
const EXAM_MINUTES = 60;

const state = {
  no: '', name: '', questions: [], endAt: 0,
  timer: null, saveTimer: null,
  done: false, submitting: false,
  lastResult: null
};

function $(id) { return document.getElementById(id); }
function show(html) { $('app').innerHTML = html; }
function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, c =>
    ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

// Calls the server with JSONP: the response loads through a <script> tag,
// which avoids the CORS limits that block fetch() responses from Apps Script.
function api(action, data) {
  return new Promise((resolve, reject) => {
    const cb = 'cb_' + Date.now() + '_' + Math.floor(Math.random() * 1000000);
    const params = new URLSearchParams();
    params.append('action', action);
    params.append('callback', cb);
    Object.keys(data || {}).forEach(k => {
      const v = data[k];
      params.append(k, typeof v === 'object' ? JSON.stringify(v) : String(v));
    });

    const s = document.createElement('script');
    const timer = setTimeout(() => { cleanup(); reject(new Error('No response from server')); }, 60000);

    function cleanup() {
      clearTimeout(timer);
      delete window[cb];
      s.remove();
    }

    window[cb] = r => { cleanup(); resolve(r); };
    s.onerror = () => { cleanup(); reject(new Error('Could not reach the server')); };
    s.src = API_URL + '?' + params.toString();
    document.body.appendChild(s);
  });
}

// ---------- LOGIN ----------
function renderLogin(msg) {
  show(`
    <h1>Student Login</h1>
    <p>Enter your student number. The exam is ${EXAM_MINUTES} minutes and the timer starts when you log in.</p>
    <input type="text" id="sno" inputmode="numeric" placeholder="Student number" autocomplete="off">
    <div style="margin-top:14px"><button id="go">Start / Resume Exam</button></div>
    <div class="msg" id="msg"></div>
  `);
  $('msg').textContent = msg || '';
  $('go').onclick = doLogin;
  $('sno').addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });
}

async function doLogin() {
  const no = $('sno').value.trim();
  if (!no) { $('msg').textContent = 'Please enter your student number.'; return; }
  $('go').disabled = true;
  $('msg').textContent = 'Checking...';
  try {
    onLogin(await api('login', { studentNo: no }));
  } catch (e) {
    $('go').disabled = false;
    $('msg').textContent = 'Error: ' + e.message + '. Please try again.';
  }
}

function onLogin(r) {
  if (!r.ok) { renderLogin(r.message); return; }
  if (r.submitted) { renderResult(r); return; }
  state.no = r.no;
  state.name = r.name;
  state.questions = r.questions;
  state.endAt = Date.now() + r.remaining * 1000;
  renderExam(r.answers);
}

// ---------- EXAM ----------
function renderExam(saved) {
  let html = `
    <div id="timer">Time left: <span id="clock">--:--</span></div>
    <h1>${esc(state.name)} &middot; ${esc(state.no)}</h1>
    <p>Type your answer for each item. Answers are saved automatically.</p>`;

  state.questions.forEach((q, i) => {
    html += `
      <div class="q">
        <div class="q-head">
          <div class="num">${i + 1}</div>
          <label for="a${i}">${esc(q)}</label>
        </div>
        <input type="text" id="a${i}" maxlength="150" autocomplete="off">
      </div>`;
  });

  html += `
    <div class="center" style="margin-top:16px"><button id="submit">Submit Exam</button></div>
    <div class="msg center" id="msg"></div>`;

  show(html);
  state.questions.forEach((_, i) => { $('a' + i).value = saved[i] || ''; });

  $('submit').onclick = () => {
    if (confirm('Submit your exam now? You cannot change your answers after submitting.')) submitExam(false);
  };

  window.onbeforeunload = () => state.done ? null : 'Your exam is still in progress.';
  tick();
  state.timer = setInterval(tick, 1000);
  state.saveTimer = setInterval(autosave, 30000);
}

function getAnswers() {
  return state.questions.map((_, i) => $('a' + i).value);
}

function tick() {
  const left = Math.max(0, Math.round((state.endAt - Date.now()) / 1000));
  const m = Math.floor(left / 60);
  const s = String(left % 60).padStart(2, '0');
  const el = $('clock');
  if (el) el.textContent = `${m}:${s}`;
  if (left <= 0 && !state.submitting) submitExam(true);
}

function autosave() {
  if (state.done || state.submitting) return;
  api('save', { studentNo: state.no, answers: getAnswers() }).catch(() => {});
}

async function submitExam(auto) {
  if (state.submitting) return;
  state.submitting = true;
  clearInterval(state.timer);
  clearInterval(state.saveTimer);
  const b = $('submit');
  if (b) b.disabled = true;
  if ($('msg')) $('msg').textContent = auto ? 'Time is up. Submitting your answers...' : 'Submitting...';

  try {
    const r = await api('submit', { studentNo: state.no, answers: getAnswers() });
    if (!r.ok) throw new Error(r.message || 'Submission was not accepted.');
    state.done = true;
    renderResult(r);
  } catch (e) {
    state.submitting = false;
    if ($('msg')) $('msg').textContent = 'Submission failed: ' + e.message + '. Your answers are saved. Please try again.';
    if (b) b.disabled = false;
    state.timer = setInterval(tick, 1000);
    state.saveTimer = setInterval(autosave, 30000);
  }
}

// ---------- RESULT ----------
// r.score and r.items are null when the teacher has hidden scores, so only the message is shown.
function renderResult(r) {
  window.onbeforeunload = null;
  clearInterval(state.timer);
  clearInterval(state.saveTimer);
  state.lastResult = r;

  const hasScore = r.score !== null && r.score !== undefined;
  const hasItems = Array.isArray(r.items);
  const pct = hasScore && r.total ? Math.round((r.score / r.total) * 100) : 0;

  const itemsHtml = hasItems
    ? r.items.map(it => `
        <div class="qa">
          <div><b>${it.no}. ${esc(it.question)}</b></div>
          <div>Your answer: ${esc(it.answer || '(no answer)')}
            <span class="${it.correct ? 'good' : 'bad'}">${it.correct ? 'Correct' : 'Incorrect'}</span></div>
          ${it.correct ? '' : `<div class="ok">Correct answer: ${esc(it.correctAnswer)}</div>`}
        </div>`).join('')
    : '';

  show(`
    <h1>Exam Result</h1>
    <p class="center">${esc(r.name)} &middot; ${esc(r.no)}</p>
    ${hasScore ? `<div class="score">${esc(r.score)} / ${esc(r.total)}</div><p class="center">${pct}%</p>` : ''}
    ${r.message ? `<p class="center">${esc(r.message)}</p>` : ''}
    ${itemsHtml}
    ${hasItems ? `<div class="center" style="margin-top:18px"><button id="dl">Download My Results</button></div>
    <div class="center" id="dlmsg"></div>` : ''}
    <p class="center">You may close this page now.</p>
  `);

  if (hasItems) $('dl').onclick = downloadResult;
}

// Builds the result file in the browser from the answers already on this page.
function downloadResult() {
  const msg = $('dlmsg');
  const r = state.lastResult;
  if (!r || !Array.isArray(r.items)) {
    msg.className = 'msg';
    msg.textContent = 'Could not download: results are not available yet.';
    return;
  }

  const blob = new Blob([buildResultHtml(r)], { type: 'text/html' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'Exam_Result_' + r.no + '.html';
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 2000);

  msg.className = 'ok';
  msg.textContent = 'Your result was downloaded. Open the file and choose Print > Save as PDF if you need a PDF.';
}

function buildResultHtml(r) {
  const rows = r.items.map(it => {
    const mark = it.correct === null
      ? ''
      : (it.correct ? '<td class="good">Correct</td>' : '<td class="bad">Incorrect</td>');
    return `<tr><td>${it.no}</td><td>${esc(it.question)}</td><td>${esc(it.answer || '(no answer)')}</td>${mark}</tr>`;
  }).join('');

  const scoreLine = r.showScore
    ? `<p class="score">${esc(r.score)} / ${esc(r.total)}</p>`
    : '';

  return `<!DOCTYPE html><html><head><meta charset="utf-8"><title>Exam Result</title>
<style>
  body { font-family: Arial, sans-serif; color: #111; max-width: 800px; margin: 24px auto; padding: 0 16px; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .meta { color: #555; margin-bottom: 12px; }
  .score { font-size: 28px; font-weight: bold; color: #1e3a8a; margin: 12px 0; }
  table { border-collapse: collapse; width: 100%; }
  th, td { border: 1px solid #bbb; padding: 6px; text-align: left; vertical-align: top; font-size: 14px; }
  th { background: #e5e7eb; }
  .good { color: #15803d; font-weight: bold; }
  .bad { color: #b91c1c; font-weight: bold; }
</style></head><body>
<h1>${esc(EXAM_TITLE)}</h1>
<div class="meta">
  Professor: Dr. Jerwin Montellano &middot; Elective 3: E-Commerce<br>
  ${esc(r.name)} &middot; ${esc(r.no)}${r.section ? ' &middot; ' + esc(r.section) : ''}<br>
  Submitted: ${esc(r.submittedAt)}
</div>
${scoreLine}
<table>
  <tr><th>No.</th><th>Question</th><th>Your answer</th>${r.showScore ? '<th>Result</th>' : ''}</tr>
  ${rows}
</table>
</body></html>`;
}

// Start: the page loads with an empty login form.
renderLogin('');
</script>
</body>
</html>
