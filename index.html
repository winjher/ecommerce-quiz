<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CS 4 Ecommerce Quiz</title>
<style>
  body { font-family: system-ui, Arial, sans-serif; background: #f4f6f8; margin: 0; padding: 16px; color: #222; }
  .card { max-width: 760px; margin: 0 auto; background: #fff; border-radius: 10px; padding: 20px; box-shadow: 0 2px 8px rgba(0,0,0,.08); }
  h1 { font-size: 20px; margin: 0 0 10px; }
  input[type=text] { width: 100%; padding: 10px; font-size: 16px; border: 1px solid #bbb; border-radius: 6px; box-sizing: border-box; }
  button { background: #2563eb; color: #fff; border: 0; border-radius: 6px; padding: 10px 18px; font-size: 16px; cursor: pointer; }
  button:disabled { background: #9ca3af; cursor: default; }
  .q { margin: 14px 0; }
  .q label { font-weight: 600; display: block; margin-bottom: 6px; }
  #timer { position: sticky; top: 0; background: #111; color: #fff; padding: 10px; border-radius: 6px; text-align: center; font-size: 18px; font-weight: bold; margin-bottom: 12px; z-index: 1; }
  .msg { color: #b91c1c; margin-top: 10px; }
  .score { font-size: 44px; font-weight: bold; text-align: center; color: #2563eb; margin: 20px 0 6px; }
  .center { text-align: center; }
</style>
</head>
<body>
<div class="card" id="app"></div>

<script>
// ============================================================
// PASTE YOUR WEB APP URL BELOW (the one ending in /exec).
// Get it from Deploy > Manage deployments > Web app URL.
// ============================================================
const ENDPOINT = 'https://script.google.com/macros/s/AKfycbzJCpmGNgLl3fGWfu4E0lpFgC_6asWSSsGqwEiKv3gpBC-FziXfeTF4uVqEsFB9VIC7/exec';

// If the placeholder above is still there, the server fills in its own URL instead.
const API_URL = ENDPOINT.indexOf('https://script.google.com/macros/s/AKfycbzJCpmGNgLl3fGWfu4E0lpFgC_6asWSSsGqwEiKv3gpBC-FziXfeTF4uVqEsFB9VIC7/exec') === -1
  ? ENDPOINT
  : '<?!= endpoint ?>';

const EXAM_TITLE = 'CS 4 Exam: Security Governance & Legal Issues';
const EXAM_MINUTES = 60;

const state = { no: '', name: '', questions: [], endAt: 0, timer: null, saveTimer: null, done: false, submitting: false };

function $(id) { return document.getElementById(id); }
function show(html) { $('app').innerHTML = html; }
function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, c =>
    ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

// Calls the web app URL. Uses text/plain so the browser sends no preflight request.
async function api(action, data) {
  const res = await fetch(API_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify(Object.assign({ action: action }, data))
  });
  if (!res.ok) throw new Error('Server responded with ' + res.status);
  return res.json();
}

// ---------- LOGIN ----------
function renderLogin(msg) {
  show(`
    <h1>${esc(EXAM_TITLE)}</h1>
    <p>Enter your student number. The exam is ${EXAM_MINUTES} minutes and the timer starts when you log in.</p>
    <input type="text" id="sno" inputmode="numeric" placeholder="Student number" autocomplete="off">
    <div style="margin-top:12px"><button id="go">Start / Resume</button></div>
    <div class="msg" id="msg"></div>
  `);
  $('msg').textContent = msg || '';
  $('go').onclick = doLogin;
  $('sno').addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });
}

async function doLogin() {
  const no = $('sno').value.trim();
  if (!no) { $('msg').textContent = 'Please enter your student number.'; return; }
  $('go').disabled = true;
  $('msg').textContent = 'Checking...';
  try {
    onLogin(await api('login', { studentNo: no }));
  } catch (e) {
    $('go').disabled = false;
    $('msg').textContent = 'Error: ' + e.message + '. Please try again.';
  }
}

function onLogin(r) {
  if (!r.ok) { renderLogin(r.message); return; }
  if (r.submitted) { renderResult(r); return; }
  state.no = r.no;
  state.name = r.name;
  state.questions = r.questions;
  state.endAt = Date.now() + r.remaining * 1000;
  renderExam(r.answers);
}

// ---------- EXAM ----------
function renderExam(saved) {
  let html = `
    <div id="timer">Time left: <span id="clock">--:--</span></div>
    <h1>${esc(state.name)} &middot; ${esc(state.no)}</h1>
    <p>Type your answer for each item. Answers are saved automatically.</p>`;

  state.questions.forEach((q, i) => {
    html += `
      <div class="q">
        <label for="a${i}">${i + 1}. ${esc(q)}</label>
        <input type="text" id="a${i}" autocomplete="off">
      </div>`;
  });

  html += `
    <button id="submit">Submit Exam</button>
    <div class="msg" id="msg"></div>`;

  show(html);
  state.questions.forEach((_, i) => { $('a' + i).value = saved[i] || ''; });

  $('submit').onclick = () => {
    if (confirm('Submit your exam now? You cannot change your answers after submitting.')) submitExam(false);
  };

  window.onbeforeunload = () => state.done ? null : 'Your exam is still in progress.';
  tick();
  state.timer = setInterval(tick, 1000);
  state.saveTimer = setInterval(autosave, 30000);
}

function getAnswers() {
  return state.questions.map((_, i) => $('a' + i).value);
}

function tick() {
  const left = Math.max(0, Math.round((state.endAt - Date.now()) / 1000));
  const m = Math.floor(left / 60);
  const s = String(left % 60).padStart(2, '0');
  const el = $('clock');
  if (el) el.textContent = `${m}:${s}`;
  if (left <= 0 && !state.submitting) submitExam(true);
}

function autosave() {
  if (state.done || state.submitting) return;
  api('save', { studentNo: state.no, answers: getAnswers() }).catch(() => {});
}

async function submitExam(auto) {
  if (state.submitting) return;
  state.submitting = true;
  clearInterval(state.timer);
  clearInterval(state.saveTimer);
  const b = $('submit');
  if (b) b.disabled = true;
  if ($('msg')) $('msg').textContent = auto ? 'Time is up. Submitting your answers...' : 'Submitting...';

  try {
    const r = await api('submit', { studentNo: state.no, answers: getAnswers() });
    if (!r.ok) throw new Error(r.message || 'Submission was not accepted.');
    state.done = true;
    renderResult(r);
  } catch (e) {
    state.submitting = false;
    if ($('msg')) $('msg').textContent = 'Submission failed: ' + e.message + '. Your answers are saved. Please try again.';
    if (b) b.disabled = false;
    state.timer = setInterval(tick, 1000);
    state.saveTimer = setInterval(autosave, 30000);
  }
}

// ---------- RESULT ----------
function renderResult(r) {
  window.onbeforeunload = null;
  clearInterval(state.timer);
  clearInterval(state.saveTimer);
  const pct = r.total ? Math.round((r.score / r.total) * 100) : 0;
  show(`
    <h1>Exam Result</h1>
    <p class="center">${esc(r.name)} &middot; ${esc(r.no)}</p>
    <div class="score">${esc(r.score)} / ${esc(r.total)}</div>
    <p class="center">${pct}%</p>
    ${r.message ? `<p class="center">${esc(r.message)}</p>` : ''}
    <p class="center">You may close this page now.</p>
  `);
}

// Start: the page loads with an empty login form.
renderLogin('');
</script>
</body>
</html>
