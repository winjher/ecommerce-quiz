<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CS 4 Exam</title>
<style>
  :root {
    --brand: #1e3a8a; --accent: #f97316; --bg: #f3f4f6; --card: #ffffff;
    --text: #1f2937; --muted: #6b7280; --good: #15803d; --bad: #b91c1c;
  }
  * { box-sizing: border-box; }
  body { font-family: system-ui, -apple-system, "Segoe UI", Arial, sans-serif; background: var(--bg); margin: 0; color: var(--text); }
  .topbar { background: var(--brand); color: #fff; padding: 14px 20px; display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  .brand { font-weight: 800; font-size: 18px; }
  .brand span { color: var(--accent); }
  .topbar .tag { background: rgba(255,255,255,.15); padding: 6px 12px; border-radius: 999px; font-size: 13px; }
  .banner { background: linear-gradient(135deg, #1e3a8a 0%, #2563eb 60%, #f97316 140%); color: #fff; padding: 26px 20px; }
  .banner-inner { max-width: 900px; margin: 0 auto; }
  .banner h2 { margin: 0 0 12px; font-size: 24px; line-height: 1.25; }
  .meta-row { display: flex; flex-wrap: wrap; gap: 10px; }
  .meta-chip { background: rgba(255,255,255,.18); border-radius: 8px; padding: 8px 12px; font-size: 14px; }
  .meta-chip b { display: block; font-size: 11px; text-transform: uppercase; opacity: .85; }
  .wrap { max-width: 900px; margin: 0 auto; padding: 16px; }
  .card { background: var(--card); border-radius: 12px; padding: 20px; box-shadow: 0 2px 10px rgba(0,0,0,.06); margin-bottom: 16px; }
  h1 { font-size: 20px; margin: 0 0 8px; }
  input[type=text] { width: 100%; padding: 12px; font-size: 16px; border: 1px solid #cbd5e1; border-radius: 8px; }
  input[type=text]:focus { outline: 2px solid var(--brand); border-color: transparent; }
  button { background: var(--accent); color: #fff; border: 0; border-radius: 8px; padding: 12px 22px; font-size: 16px; font-weight: 600; cursor: pointer; }
  button:disabled { background: #9ca3af; cursor: default; }
  button.secondary { background: var(--brand); }
  #timer { position: sticky; top: 0; z-index: 5; background: #111827; color: #fff; padding: 12px; border-radius: 10px; text-align: center; font-size: 18px; font-weight: 700; margin-bottom: 14px; }
  .saved { font-size: 12px; color: var(--muted); }
  .q { background: var(--card); border: 1px solid #e5e7eb; border-radius: 12px; padding: 16px; margin-bottom: 12px; }
  .q-head { display: flex; gap: 12px; align-items: flex-start; margin-bottom: 10px; }
  .num { flex: 0 0 auto; width: 30px; height: 30px; border-radius: 50%; background: var(--brand); color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 14px; }
  .q label { font-weight: 600; line-height: 1.4; }
  .msg { color: var(--bad); margin-top: 10px; }
  .ok { color: var(--good); margin-top: 10px; }
  .warn { color: var(--bad); font-weight: 600; text-align: center; }
  .center { text-align: center; }
  .summary { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin: 16px 0; }
  .stat { background: #eff6ff; border-radius: 10px; padding: 12px 8px; text-align: center; }
  .stat b { display: block; font-size: 22px; color: var(--brand); }
  .stat span { font-size: 12px; color: var(--muted); text-transform: uppercase; }
  .ans-table { width: 100%; border-collapse: collapse; margin-top: 12px; font-size: 14px; }
  .ans-table th, .ans-table td { border: 1px solid #e5e7eb; padding: 8px; text-align: left; vertical-align: top; }
  .ans-table th { background: #f3f4f6; }
  .good { color: var(--good); font-weight: 700; }
  .bad { color: var(--bad); font-weight: 700; }
  footer { text-align: center; color: var(--muted); font-size: 13px; padding: 20px 16px 30px; }
  @media (max-width: 480px) { .banner h2 { font-size: 20px; } .summary { grid-template-columns: repeat(2, 1fr); } }
</style>
</head>
<body>

<div class="topbar">
  <div class="brand">CS <span>4</span> Exam Portal</div>
  <div class="tag">Elective 3 &middot; E-Commerce</div>
</div>

<div class="banner">
  <div class="banner-inner">
    <h2>CS 4 Exam: Security Governance &amp; Legal Issues</h2>
    <div class="meta-row">
      <div class="meta-chip"><b>Professor</b>Dr. Jerwin Montellano</div>
      <div class="meta-chip"><b>Subject</b>Elective 3: E-Commerce</div>
      <div class="meta-chip"><b>Duration</b>60 minutes</div>
    </div>
  </div>
</div>

<div class="wrap">
  <div class="card" id="app"></div>
</div>

<footer>Dr. Jerwin Montellano &middot; Elective 3: E-Commerce<br><span id="ver"></span></footer>

<script>
// The server fills in the URL of the web app this page was opened from.
const API_URL = 'https://script.google.com/macros/s/AKfycbzYHZthKX01IdpoZPdJ2yqgGr-U0Waf0sCy_XH2LdFvbohvejoke1wSDamDvJLpxuYA/exec';
const EXAM_MINUTES = 60;

const state = {
  no: '', name: '', questions: [], endAt: 0,
  timer: null, saveTimer: null,
  done: false, submitting: false, autoTried: false
};

function $(id) { return document.getElementById(id); }
function show(html) { $('app').innerHTML = html; }
function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, c =>
    ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

// Every server call uses JSONP (a script tag). Objects are sent as JSON text in the query string.
function apiGet(action, data) {
  return new Promise((resolve, reject) => {
    const cb = 'cb_' + Date.now() + '_' + Math.floor(Math.random() * 1000000);
    const params = new URLSearchParams();
    params.append('action', action);
    params.append('callback', cb);
    Object.keys(data || {}).forEach(k => {
      const v = data[k];
      params.append(k, typeof v === 'object' ? JSON.stringify(v) : String(v));
    });
    const s = document.createElement('script');
    const timer = setTimeout(() => { cleanup(); reject(new Error('No response from server')); }, 60000);
    function cleanup() { clearTimeout(timer); delete window[cb]; s.remove(); }
    window[cb] = r => { cleanup(); resolve(r); };
    s.onerror = () => { cleanup(); reject(new Error('Could not reach the server')); };
    s.src = API_URL + '?' + params.toString();
    document.body.appendChild(s);
  });
}

// Shows the server version so you can confirm the student is on the current build.
apiGet('ping', {}).then(r => {
  $('ver').textContent = 'Server version: ' + (r && r.version ? r.version : 'unknown');
}).catch(() => {});

function setMsg(text, isErr) {
  const m = $('msg');
  if (m) { m.className = isErr ? 'msg center' : 'ok center'; m.textContent = text; }
}

// ---------- LOGIN ----------
function renderLogin(msg) {
  show(`
    <h1>Student Login</h1>
    <p>Enter your student number. The exam is ${EXAM_MINUTES} minutes and the timer starts when you log in.</p>
    <input type="text" id="sno" inputmode="numeric" placeholder="Student number" autocomplete="off">
    <div style="margin-top:14px;display:flex;gap:10px;flex-wrap:wrap">
      <button id="go">Start / Resume Exam</button>
      <button id="check" class="secondary">Check my result</button>
    </div>
    <div class="msg" id="msg"></div>
  `);
  $('msg').textContent = msg || '';
  $('go').onclick = () => doLogin(false);
  $('check').onclick = () => doLogin(true);
  $('sno').addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(false); });
}

async function doLogin(resultOnly) {
  const no = $('sno').value.trim();
  if (!no) { $('msg').textContent = 'Please enter your student number.'; return; }
  $('msg').textContent = 'Checking...';
  try {
    const r = resultOnly ? await apiGet('result', { studentNo: no }) : await apiGet('login', { studentNo: no });
    if (r && r.submitted === true && Array.isArray(r.items)) { renderResult(r); return; }
    if (resultOnly) { renderLogin((r && r.message) || 'Your result is not available yet.'); return; }
    onLogin(r);
  } catch (e) {
    $('msg').textContent = 'Error: ' + e.message + '. Please try again.';
  }
}

function onLogin(r) {
  if (!r || !r.ok) { renderLogin(r && r.message); return; }
  state.no = r.no;
  state.name = r.name;
  if (r.submitted === true && Array.isArray(r.items)) { renderResult(r); return; }
  state.questions = r.questions;
  state.endAt = Date.now() + r.remaining * 1000;
  renderExam(r.answers || {});
}

// ---------- EXAM ----------
function renderExam(saved) {
  let html = `
    <div id="timer">Time left: <span id="clock">--:--</span></div>
    <h1>${esc(state.name)} &middot; ${esc(state.no)}</h1>
    <p>Answers are saved automatically. <span id="saved" class="saved"></span></p>`;

  state.questions.forEach((item, i) => {
    html += `
      <div class="q">
        <div class="q-head">
          <div class="num">${i + 1}</div>
          <label for="a${i}">${esc(item.q)}</label>
        </div>
        <input type="text" id="a${i}" maxlength="150" autocomplete="off">
      </div>`;
  });

  html += `
    <div class="center" style="margin-top:16px"><button id="submit">Submit Exam</button></div>
    <div class="msg center" id="msg"></div>`;

  show(html);
  state.questions.forEach((item, i) => {
    $('a' + i).value = saved[item.id] || '';
    $('a' + i).addEventListener('change', autosave);
  });

  $('submit').onclick = () => {
    if (confirm('Submit your exam now? You cannot change your answers after submitting.')) submitExam(false);
  };
  window.onbeforeunload = () => state.done ? null : 'Your exam is still in progress.';
  tick();
  state.timer = setInterval(tick, 1000);
  state.saveTimer = setInterval(autosave, 30000);
}

// Answers are keyed by question id, which is how the server stores them.
function getAnswers() {
  const o = {};
  state.questions.forEach((item, i) => { o[item.id] = $('a' + i).value; });
  return o;
}

function tick() {
  const left = Math.max(0, Math.round((state.endAt - Date.now()) / 1000));
  const el = $('clock');
  if (el) el.textContent = Math.floor(left / 60) + ':' + String(left % 60).padStart(2, '0');
  if (left <= 0 && !state.autoTried && !state.submitting && !state.done) {
    state.autoTried = true;
    submitExam(true);
  }
}

function autosave() {
  if (state.done || state.submitting || !state.no) return;
  apiGet('save', { studentNo: state.no, answers: getAnswers() })
    .then(r => {
      const el = $('saved');
      if (el) el.textContent = r && r.ok ? 'Saved ' + new Date().toLocaleTimeString() : 'Not saved: ' + ((r && r.message) || '');
    })
    .catch(() => { const el = $('saved'); if (el) el.textContent = 'Not saved (no connection)'; });
}

async function submitExam(auto) {
  if (state.submitting || state.done) return;
  state.submitting = true;
  clearInterval(state.timer);
  clearInterval(state.saveTimer);
  const b = $('submit');
  if (b) b.disabled = true;
  setMsg(auto ? 'Time is up. Submitting your answers...' : 'Submitting...', false);

  try {
    const r = await apiGet('submit', { studentNo: state.no, answers: getAnswers(), auto: auto ? 'true' : 'false' });
    if (r && r.submitted === true && Array.isArray(r.items)) { renderResult(r); return; }
    // The server may already have this exam recorded. Ask for the result before reporting a failure.
    const again = await apiGet('result', { studentNo: state.no });
    if (again && again.submitted === true && Array.isArray(again.items)) { renderResult(again); return; }
    throw new Error((r && r.message) || 'Submission was not accepted.');
  } catch (e) {
    state.submitting = false;
    setMsg('Submission failed: ' + e.message + '. Your answers are saved on the server. Please press Submit again.', true);
    if (b) b.disabled = false;
    state.timer = setInterval(tick, 1000);
    state.saveTimer = setInterval(autosave, 30000);
  }
}

// ---------- RESULT ----------
function renderResult(r) {
  if (!r || r.submitted !== true || !Array.isArray(r.items)) {
    show('<h1>Exam Result</h1><p class="center">Your result is not available until you submit the exam.</p>');
    return;
  }
  // Keep the student details so the PDF button works after any way of opening the result.
  state.no = r.no;
  state.name = r.name;

  window.onbeforeunload = null;
  clearInterval(state.timer);
  clearInterval(state.saveTimer);
  state.done = true;

  const shown = !!r.showScore && typeof r.score === 'number' && !!r.total;
  const correct = shown ? r.score : 0;
  const total = shown ? r.total : 0;
  const pct = total ? ((correct / total) * 100).toFixed(1) : '0.0';

  const summary = shown ? `
    <div class="summary">
      <div class="stat"><b>${correct} / ${total}</b><span>Score</span></div>
      <div class="stat"><b>${pct}%</b><span>Percentage</span></div>
      <div class="stat"><b>${correct}</b><span>Correct</span></div>
      <div class="stat"><b>${total - correct}</b><span>Incorrect</span></div>
    </div>` : '';

  const warning = r.answered === 0
    ? '<p class="warn">No answers were recorded for this exam. Please tell your teacher.</p>' : '';

  const rows = r.items.map(it => {
    const mark = shown
      ? `<td class="${it.correct ? 'good' : 'bad'}">${it.correct ? 'Correct' : 'Incorrect'}</td>` : '';
    const key = shown ? `<td>${esc(it.correctAnswer)}</td>` : '';
    return `<tr><td>${it.no}</td><td>${esc(it.question)}</td><td>${esc(it.answer || '(no answer)')}</td>${key}${mark}</tr>`;
  }).join('');

  show(`
    <h1>Exam Result</h1>
    <p class="center">${esc(r.name)} &middot; ${esc(r.no)}${r.submittedAt ? ' &middot; Submitted ' + esc(r.submittedAt) : ''}</p>
    ${summary}
    ${r.message ? `<p class="center">${esc(r.message)}</p>` : ''}
    ${warning}
    <table class="ans-table">
      <tr><th>No.</th><th>Question</th><th>Your answer</th>${shown ? '<th>Correct answer</th><th>Result</th>' : ''}</tr>
      ${rows}
    </table>
    <div class="center" style="margin-top:18px"><button id="dl">Download My Result (PDF)</button></div>
    <div class="center" id="dlmsg"></div>
    <p class="center">You may close this page now.</p>
  `);
  $('dl').onclick = downloadPdf;
}

async function downloadPdf() {
  const btn = $('dl');
  const msg = $('dlmsg');
  btn.disabled = true;
  msg.className = 'ok';
  msg.textContent = 'Preparing your PDF...';
  try {
    const r = await apiGet('pdf', { studentNo: state.no });
    if (!r || !r.ok) throw new Error((r && r.message) || 'Could not create the PDF.');
    const bin = atob(r.base64);
    const bytes = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    const url = URL.createObjectURL(new Blob([bytes], { type: 'application/pdf' }));
    const a = document.createElement('a');
    a.href = url;
    a.download = r.filename || ('Exam_Result_' + state.no + '.pdf');
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 5000);
    msg.textContent = 'Your PDF was downloaded.';
  } catch (e) {
    msg.className = 'msg';
    msg.textContent = 'Could not create the PDF: ' + e.message;
  } finally {
    btn.disabled = false;
  }
}

renderLogin('');
</script>
</body>
</html>
